<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Timezones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>World Clock</h1>
        <div class="clock-grid" id="clockGrid"></div>
        <div class="controls">
            <button id="addTimezone" class="btn-primary">+ Add Timezone</button>
            <button id="toggleFormat" class="btn-secondary">Toggle 12/24 Hour</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
